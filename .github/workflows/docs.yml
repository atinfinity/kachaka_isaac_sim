name: Docs

# Builds the project site with Zensical (scripts/build_site.py) on every pull
# request that touches the docs, and publishes it to GitHub Pages from main.
on:
  push:
    branches: [main]
    paths: [docs/**, README.md, README.ja.md, scripts/build_site.py, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, README.md, README.ja.md, scripts/build_site.py, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install zensical==0.0.72
      - run: python3 scripts/build_site.py --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
