name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ROS_IMAGE: kachaka-isaac-sim-ros:jazzy

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17.1 check --output-format github

  unit-tests:
    # The modules that need neither Isaac Sim nor ROS (tests/unit).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Fetch the Kachaka description
        run: python3 scripts/fetch_assets.py
      - run: uv run --no-project --with pytest --with numpy --with pyyaml --with pillow python -m pytest -v

  ros:
    # The ROS 2 image: colcon test, Nav2 and slam_toolbox with fake_robot
    # standing in for the simulator, then the kachaka-api checks with
    # scripts/fake_sim.py (the simulator's own ROS node and gRPC server).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Kachaka description
        run: python3 scripts/fetch_assets.py
      - uses: docker/setup-buildx-action@v3
      - name: Build the ROS 2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ env.ROS_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: colcon test
        run: |
          docker run --rm "$ROS_IMAGE" bash -c \
            'colcon test --packages-select kachaka_sim_bringup --event-handlers console_direct+ \
             && colcon test-result --verbose'
      - name: Nav2 and slam_toolbox config check
        run: |
          mkdir -p build/nav2_check
          docker run --rm -v "$PWD:/repo" -e CHECK_LOG_DIR=/repo/build/nav2_check "$ROS_IMAGE" \
            python3 /repo/tests/nav2_config_check.py
      - name: kachaka-api check against the fake simulator
        run: |
          python3 scripts/build_usd.py --urdf-only
          mkdir -p build/api_fake
          docker run --rm -v "$PWD:/repo" -e CHECK_LOG_DIR=/repo/build/api_fake "$ROS_IMAGE" \
            python3 /repo/tests/api_fake_check.py
      - name: Speed limits against the fake simulator
        run: |
          mkdir -p build/speed_check
          docker run --rm -v "$PWD:/repo" -e CHECK_LOG_DIR=/repo/build/speed_check "$ROS_IMAGE" \
            python3 /repo/tests/speed_limit_check.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ros-check-logs
          path: |
            build/nav2_check
            build/speed_check
            build/api_fake
          if-no-files-found: ignore
