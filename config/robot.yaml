# Kachaka simulation parameters.
# (est.) = not published by Preferred Robotics; taken from the community Gazebo
# model (CyberAgentAILab/kachaka_ros2_dev_kit) or chosen for the simulator.

ros:
  namespace: kachaka
  frame_prefix: ""          # same role as FRAME_PREFIX on the real bridge
  remap_generic: false      # also use /cmd_vel, /scan, /odom style names

drive:
  wheel_radius: 0.045       # m, official URDF
  wheel_separation: 0.200   # m, official URDF
  max_linear_vel: 0.3       # m/s, full scale of the real bridge (spec top speed 0.8)
  max_angular_vel: 1.57     # rad/s, full scale of the real bridge
  max_linear_vel_towing: 0.5  # m/s, cap while towing a shelf (spec top speed with a shelf)
  max_linear_accel: 2.0     # m/s^2 (est.)
  max_angular_accel: 3.0    # rad/s^2 (est.)
  wheel_max_torque: 2.0     # Nm per wheel, Kachaka Pro max motor torque
  wheel_damping: 10.0       # Nm*s/rad, velocity drive gain
  wheel_friction: 1.0       # (est.)
  caster_friction: 0.02
  cmd_vel_timeout: 0.5      # s, stop if no command arrives

odometry:
  rate: 20.0                # Hz (est.)
  # Noise added to the fused odometry (per sqrt(second) random walk).
  fused_noise_xy: 0.002
  fused_noise_yaw: 0.002

lidar:
  frame_id: laser_frame
  rate: 10.0                # Hz (est.)
  samples: 400              # (est.)
  fov_deg: 240.0            # (est.)
  min_range: 0.1            # m (est.)
  max_range: 10.0           # m (spec says 12 m on Kachaka Pro)
  noise_stddev: 0.03        # m (est.)

cameras:
  front:
    enabled: true
    frame_id: camera_front
    width: 640              # (est.; real camera may be larger)
    height: 480
    hfov_deg: 90.0          # (est.)
    near_clip: 0.025        # m, lens is just behind the body shell
    rate: 10.0
  back:
    enabled: true
    frame_id: camera_back
    width: 640
    height: 480
    hfov_deg: 90.0
    near_clip: 0.025
    rate: 10.0

tof:
  enabled: true
  frame_id: tof_camera
  encoding: 16UC1           # depth in mm (16UC1) or m (32FC1); real format unknown
  width: 160                # (est.)
  height: 120
  hfov_deg: 70.0            # (est.)
  min_range: 0.01
  max_range: 5.0
  near_clip: 0.01
  rate: 10.0

imu:
  frame_id: imu_link
  rate: 100.0               # Hz (est.)
  gyro_noise: 0.002         # rad/s stddev (est.)
  accel_noise: 0.02         # m/s^2 stddev (est.)

stubs:
  version: "kachaka-isaac-sim 0.1.0"

battery:
  initial_percentage: 1.0
  drain_per_hour: 0.5       # fraction per hour of sim time, off the charger (est.)
  charge_per_hour: 1.0      # fraction per hour of sim time, on the charger (est.)

# Charging dock. The pose is given per world (scripts/run_sim.py --charger);
# it is the base_footprint pose of a docked robot, which faces away from the
# dock: the robot backs onto it, as the real one does.
charger:
  room_pose: [-2.27, 0.0, 0.0]  # x, y, yaw in the default room (back panel on the west wall)
  width: 0.26               # m (est.)
  panel_height: 0.09        # m (est.)
  panel_thickness: 0.04     # m (est.)
  plate_depth: 0.13         # m, floor plate under the robot's rear (est.)
  gap: 0.03                 # m, robot rear to panel when docked (est.)
  robot_rear: 0.16          # m, base_footprint to the robot's back (footprint)
  tolerance_xy: 0.04        # m, contacts touch within this distance (est.)
  tolerance_yaw: 0.15       # rad (est.)
  # The real robot stops its LiDAR and ToF on the charger. Off by default here:
  # the real robot localizes itself, but the bundled ROS 2 stack relies on
  # slam_toolbox, whose map->odom transform goes stale without scans, so Nav2
  # could not drive off the charger. Set true to test code against the real
  # behaviour.
  sensors_off: false
  # The dock pose relative to the robot is published within this range
  # (sim/charger_detection), for Nav2's docking server. How the real robot
  # finds its dock is not published; this stands in for it.
  detection_range: 1.5      # m

# Kachaka Shelf (3-layer). The shelf rolls on four casters and is towed through
# a fixed joint while docked. Its pose is the base_footprint pose of a robot
# docked under it (the robot's docking pin under the shelf centre), and the
# robot drives in and out along the shelf's x axis (the 328 mm side).
shelf:
  mass: 6.0                 # kg (est.)
  caster_friction: 0.02
  dock_tolerance_xy: 0.05   # m, the pin must be this close to the shelf centre (est.)
  dock_tolerance_yaw: 0.2   # rad, from either direction along the shelf's x axis (est.)
  # Shelves and extra locations in the default room ([x, y, yaw], world frame).
  # Other worlds take them from scripts/run_sim.py --shelf.
  room:
    - {id: S01, name: Shelf 1, pose: [1.3, -1.2, 0.0]}
  room_locations:
    - {id: L01, name: Kitchen, pose: [0.5, 1.0, 1.5708]}
