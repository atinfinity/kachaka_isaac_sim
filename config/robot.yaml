# Kachaka simulation parameters.
# (est.) = not published by Preferred Robotics; taken from the community Gazebo
# model (CyberAgentAILab/kachaka_ros2_dev_kit) or chosen for the simulator.

ros:
  namespace: kachaka
  frame_prefix: ""          # same role as FRAME_PREFIX on the real bridge
  remap_generic: false      # also use /cmd_vel, /scan, /odom style names

drive:
  wheel_radius: 0.045       # m, official URDF
  wheel_separation: 0.200   # m, official URDF
  # Manual cmd_vel (manual_control/cmd_vel, SetRobotVelocity) is capped at the
  # real bridge's full scale. Autonomous motion (Nav2 through nav_bridge and
  # command_server, on the simulator-only sim/autonomous/cmd_vel) goes up to
  # the spec top speed. Both are capped at the towing speed with a shelf.
  max_linear_vel: 0.3       # m/s, manual: full scale of the real bridge
  max_linear_vel_auto: 0.8  # m/s, autonomous: spec top speed (est. until measured, #4)
  max_linear_vel_towing: 0.5  # m/s, with a shelf: spec top speed (est. until measured, #4)
  max_angular_vel: 1.57     # rad/s, full scale of the real bridge
  max_linear_accel: 2.0     # m/s^2 (est.)
  max_angular_accel: 3.0    # rad/s^2 (est.)
  wheel_max_torque: 2.0     # Nm per wheel, Kachaka Pro max motor torque
  wheel_damping: 10.0       # Nm*s/rad, velocity drive gain
  wheel_friction: 1.0       # (est.)
  caster_friction: 0.02
  cmd_vel_timeout: 0.5      # s, stop if no command arrives

odometry:
  rate: 20.0                # Hz (est.)
  # Noise added to the fused odometry (per sqrt(second) random walk).
  fused_noise_xy: 0.002
  fused_noise_yaw: 0.002

lidar:
  frame_id: laser_frame
  rate: 10.0                # Hz (est.)
  samples: 400              # (est.)
  fov_deg: 240.0            # (est.)
  min_range: 0.1            # m (est.)
  max_range: 10.0           # m (spec says 12 m on Kachaka Pro)
  noise_stddev: 0.03        # m (est.)

cameras:
  front:
    enabled: true
    frame_id: camera_front
    width: 640              # (est.; real camera may be larger)
    height: 480
    hfov_deg: 90.0          # (est.)
    near_clip: 0.025        # m, lens is just behind the body shell
    rate: 10.0
  back:
    enabled: true
    frame_id: camera_back
    width: 640
    height: 480
    hfov_deg: 90.0
    near_clip: 0.025
    rate: 10.0

tof:
  enabled: true
  frame_id: tof_camera
  encoding: 16UC1           # depth in mm (16UC1) or m (32FC1); real format unknown
  width: 160                # (est.)
  height: 120
  hfov_deg: 70.0            # (est.)
  min_range: 0.01
  max_range: 5.0
  near_clip: 0.01
  rate: 10.0

# Front and back torch lights (SetFrontTorchIntensity / SetBackTorchIntensity,
# 0-255 per kachaka-api.proto). Where they sit on the real robot is not
# documented and the URDF has no frame for them, so they are placed at the
# cameras (assumed). Product photos (rt-net.jp/service/kachaka) show a small
# unlabelled round window a few cm beside the front camera, possibly the torch. Brightness, beam and colour are unknown too (est.);
# calibrate with #4.
torch:
  front:
    frame_id: camera_front  # no torch frame in the URDF: the camera stands in
  back:
    frame_id: camera_back
  max_intensity: 30000000.0  # USD SphereLight intensity at level 255 (est.)
  radius: 0.01              # m
  cone_angle_deg: 35.0      # half angle of the beam (est.)
  cone_softness: 0.3
  color: [1.0, 0.95, 0.88]  # warm white (est.)

# Front obstacle stop. The real robot stops by itself when something is just in
# front of it; its smartphone app turns this off. Here the initial state is set
# below and the simulator-only service sim/front_stop/set_enabled switches it.
# Forward motion brakes once the LiDAR clearance ahead falls to
# margin + v * scan period + v^2 / (2 * drive.max_linear_accel). Turning and
# backing up stay allowed. The real stop distance and zone are not published.
front_stop:
  enabled: true
  front_x: 0.23             # m, base_footprint to the front of the body (body 387 mm, rear at -0.16)
  half_width: 0.15          # m, watched lane: body 240 mm wide plus 3 cm a side; clears shelf legs (+-0.172 m)
  margin: 0.03              # m (est.)

# Step (cliff) sensors. The real robot has two step sensors at the front
# (secondary sources; their positions and range are not published, so all
# numbers here are assumed). A downward ray from each sensor that finds no
# floor within height + threshold sees a drop: the robot stops at once,
# cancels its command and pauses with errors 21052 "Step detected" and 21051
# "paused" (GetError) until the power button (sim/power_button, or
# RestartRobot) is pressed. After that, forward motion stays blocked while a
# sensor still sees the drop; backing up and turning are allowed.
cliff:
  enabled: true
  sensors:                  # [x, y] in base_footprint, just ahead of the front casters (assumed)
    - [0.215, 0.075]
    - [0.215, -0.075]
  height: 0.02              # m, sensor height above the floor (assumed)
  threshold: 0.02           # m, a drop deeper than this counts (est.)

# Collisions of the body with other objects (PhysX contact reports). The real
# robot has no published bumper, so by default contacts are only counted and
# published on sim/collision. stop: true makes a collision stop the robot,
# cancel its command and report simulator error -18 until the power button
# (sim/power_button, RestartRobot) or sim/reset (assumed behaviour).
collision:
  stop: false
  debounce: 0.5             # s without contact before the same object counts again
  ignore:                   # prim path prefixes that never count
    - /World/GroundPlane
    - /World/Floor

# Floors with drops (scripts/run_sim.py --drop X Y SX SY): the floor is built
# from tiles around the holes, and the ground under them is this much lower.
drop:
  depth: 0.15               # m

# Object detection (GetObjectDetection, /kachaka/object_detection/result).
# People, shelves and the charger are detected in the front camera image from
# the renderer's ground truth: only their visible pixels count, so whatever
# stands in front hides them. How the real detector scores, what it misses
# and how far it sees are not published; all numbers below are guesses (est.).
# The ROI is in the simulated front camera's pixels (cameras.front).
object_detection:
  enabled: true             # needs the cameras (not --no-cameras)
  max_distance: 5.0         # m, median distance of the visible pixels (est.)
  min_pixels: 150           # visible pixels needed (est.)
  full_pixels: 20000        # visible pixels for score_max (est.)
  score_min: 0.5            # score at min_pixels (est.)
  score_max: 0.95           # (est.)
  score_noise: 0.03         # stddev (est.)
  roi_noise_px: 2.0         # stddev of each ROI edge [px] (est.)
  miss_rate: 0.02           # chance to miss an object in a frame (est.)

# People: standing still, seen by the cameras, the detector and the LiDAR.
people:
  height: 1.7               # m, of the colliders (and the mannequin)
  # Isaac Sim characters (Isaac/People/Characters/<name>/<name>.usd), taken in
  # turn, standing with the arms down; [] or no asset server: mannequins of capsules.
  characters: [F_Business_02, M_Medical_01, male_adult_construction_05_new, F_Medical_01]
  room:                     # in the default room ([x, y, yaw], world frame)
    - [2.0, 1.5, -2.5]      # north-east corner, half behind box_a
    - [-2.1, -1.55, 0.6]    # south-west corner, half behind box_b, off the test routes

# People and boxes that move (layout files: route, wander, appear).
movers:
  person_speed: 0.7         # m/s, an unhurried indoor walk (est.)
  box_speed: 0.4            # m/s, a pushed cart (est.)
  turn_rate: 2.0            # rad/s
  lookahead: 0.6            # m, a mover waits while the robot is this close ahead ...
  gap: 0.15                 # m ... within this gap of its footprint,
  give_way: 3.0             # s, then turns back (or wanders elsewhere)

imu:
  frame_id: imu_link
  rate: 100.0               # Hz (est.)
  gyro_noise: 0.002         # rad/s stddev (est.)
  accel_noise: 0.02         # m/s^2 stddev (est.)

# Harder sensor conditions (kachaka_isaac_sim/degradation.py), to see how
# SLAM, AMCL and Nav2 cope. All off by default; the values are test knobs, not
# measurements of the real robot. For more random odometry drift raise
# odometry.fused_noise_*; for more LiDAR noise lidar.noise_stddev.
degradation:
  lidar:
    # Prim path patterns (fnmatch; a prim and everything under it). The LiDAR
    # sees through `invisible` (glass) and sees `dark` (black, low
    # reflectivity) only within dark_range.
    invisible: []           # e.g. ["/World/Room/Glass*"]
    dark: []
    dark_range: 1.5         # m
    dropout: 0.0            # chance a ray returns nothing
    noise_per_m: 0.0        # m of range noise stddev per metre of range, on top of noise_stddev
  odometry:
    # Floor rectangles where the wheels slip: the odometry (fused and wheel)
    # reads (1 + slip) times the travel and turn made there.
    slip_areas: []          # e.g. [{rect: [x0, y0, x1, y1], slip: 0.3}], world frame
    distance_scale_error: 0.0   # e.g. 0.02: reads 2 % more distance than driven
    turn_scale_error: 0.0       # e.g. -0.03: reads 3 % less turn
  cameras:                  # front and back RGB
    noise: 0.0              # pixel noise stddev, 8-bit levels
    exposure_jitter: 0.0    # stddev of the wandering exposure, in stops
    exposure_time_constant: 5.0  # s, how fast the exposure wanders
    exposure_time: 0.0      # s the shutter is open: horizontal blur while turning
  imu:
    gyro_bias: 0.0          # rad/s, stddev of the bias at start, per axis
    gyro_bias_walk: 0.0     # rad/s per sqrt(s); the z bias also turns the orientation
    accel_bias: 0.0         # m/s^2
    accel_bias_walk: 0.0    # m/s^2 per sqrt(s)

stubs:
  version: "kachaka-isaac-sim 0.1.0"

api:
  # GetObjectDetectionFeatures: feature maps of the front camera image in the
  # shapes of the robot's (p4_out, p5_out, p6_out), from an ImageNet
  # MobileNetV3-Large, not the robot's detector (kachaka_isaac_sim/
  # detection_features.py). Needs torch and torchvision; the weights
  # (22 MB) are downloaded into the torch hub cache on the first call.
  detection_features: true
  # kachaka-api GetShortcuts / StartShortcutCommand. Each command is a
  # kachaka-api Command in protobuf JSON; they run one after another.
  shortcuts:
    - id: go_home
      name: Go home
      commands:
        - return_home_command: {}
    - id: hello
      name: Say hello
      commands:
        - speak_command: {text: Hello}
        - rotate_in_place_command: {angle_radian: 6.2832}

battery:
  initial_percentage: 1.0
  drain_per_hour: 0.5       # fraction per hour of sim time, off the charger (est.)
  charge_per_hour: 1.0      # fraction per hour of sim time, on the charger (est.)

# Charging dock. The pose is given per world (scripts/run_sim.py --charger);
# it is the base_footprint pose of a docked robot, which faces away from the
# dock: the robot backs onto it, as the real one does.
charger:
  room_pose: [-2.27, 0.0, 0.0]  # x, y, yaw in the default room (back panel on the west wall)
  width: 0.26               # m (est.)
  panel_height: 0.09        # m (est.)
  panel_thickness: 0.04     # m (est.)
  plate_depth: 0.13         # m, floor plate under the robot's rear (est.)
  gap: 0.03                 # m, robot rear to panel when docked (est.)
  robot_rear: 0.16          # m, base_footprint to the robot's back (footprint)
  tolerance_xy: 0.04        # m, contacts touch within this distance (est.)
  tolerance_yaw: 0.15       # rad (est.)
  # The real robot stops its LiDAR and ToF on the charger. Off by default here:
  # the real robot localizes itself, but the bundled ROS 2 stack relies on
  # slam_toolbox, whose map->odom transform goes stale without scans, so Nav2
  # could not drive off the charger. Set true to test code against the real
  # behaviour.
  sensors_off: false
  # The dock pose relative to the robot is published within this range
  # (sim/charger_detection), for Nav2's docking server. How the real robot
  # finds its dock is not published; this stands in for it.
  detection_range: 1.5      # m

# Doors (scripts/run_sim.py --door): props for testing blocked routes, not
# modelled on a particular door.
door:
  kind: sliding             # sliding or hinged
  width: 0.8                # m, doorway
  thickness: 0.04           # m, panel
  height: 2.0               # m, panel
  sliding_speed: 0.5        # m/s
  hinged_speed: 1.5         # rad/s
  # Automatic sliding doors (layout `auto: true`, run_sim.py --door-auto).
  # Real sensors (microwave, infrared) differ by product; these are assumed.
  auto:
    range: 1.0              # m, sensor reach on each side of the doorway (assumed)
    margin: 0.3             # m, beyond each edge of the doorway along the wall (assumed)
    hold: 2.0               # s, stays open after the sensor clears (assumed)
    movers: true            # moving people and boxes open it too

# Elevator between floors (layout `floors` and `elevator`; see
# kachaka_isaac_sim/elevator.py). Assumed, not modelled on a particular
# elevator. Its door moves at door.sliding_speed.
elevator:
  size: [1.4, 1.4]          # m, inside the car: across, deep
  door_width: 0.9           # m
  ride: 5.0                 # s per floor, door closed
  door_sensor: 0.23         # m, the car door stays open while base_footprint is this close to the doorway
                            # (front of the body; assumed)

# A world built from an occupancy map (run_sim.py --world map:<yaml or image>;
# see kachaka_isaac_sim/map_world.py): occupied cells become walls.
map_world:
  wall_height: 1.0          # m, every wall the same (a map has no heights)

# Kachaka Shelf (3-layer). The shelf rolls on four casters and is towed through
# a fixed joint while docked. Its pose is the base_footprint pose of a robot
# docked under it (the robot's docking pin under the shelf centre), and the
# robot drives in and out along the shelf's x axis (the 328 mm side).
shelf:
  mass: 6.0                 # kg (est.)
  caster_friction: 0.02
  dock_tolerance_xy: 0.05   # m, the pin must be this close to the shelf centre (est.)
  dock_tolerance_yaw: 0.2   # rad, from either direction along the shelf's x axis (est.)
  # Shelves and extra locations in the default room ([x, y, yaw], world frame).
  # Other worlds take them from scripts/run_sim.py --shelf.
  room:
    - {id: S01, name: Shelf 1, pose: [1.3, -1.2, 0.0]}
  room_locations:
    - {id: L01, name: Kitchen, pose: [0.5, 1.0, 1.5708]}
