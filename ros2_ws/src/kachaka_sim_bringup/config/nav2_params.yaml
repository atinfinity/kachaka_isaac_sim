# Nav2 parameters for Kachaka, adapted from the Jazzy nav2_bringup defaults.
# Changes: base_footprint frames, Kachaka footprint, /kachaka/lidar/scan,
# the simulator's autonomous top speed (0.8 m/s, est.; command_server sends
# a 0.5 m/s speed_limit while a shelf is docked; a real Kachaka's bridge caps
# cmd_vel at 0.3 m/s, set vx_max and the smoother to that there), the bridge's
# 1.57 rad/s, smaller inflation,
# and a collision-monitor height range that includes the LiDAR (z = 0.105 m).
# Nav2 never drives backwards: the LiDAR covers only 240 deg to the front and
# Kachaka has no rear range sensor (MPPI vx_min 0, smoother min x 0, and
# behavior trees without the BackUp recovery). The exception is docking onto
# the charger, which the real robot also does backwards (docking_server).
# /odom and /cmd_vel are relayed to the Kachaka namespace by nav_bridge.
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /kachaka/lidar/scan
    # Start at the map frame's origin: the saved maps (make_maps.py, SLAM)
    # put it at the spawn pose. Without this AMCL sends no map -> odom until
    # an /initialpose comes, and RViz draws the robot model white. Applied
    # once, when AMCL starts: a later map load keeps the pose it is given.
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # ms the BT waits for an action server (planner, controller) to accept a
    # goal. Nav2's 20 ms is too short while the planner is busy, as right
    # after startup when the global costmap resizes with the growing SLAM
    # map: the goal then fails at once with status 6.
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    default_nav_to_pose_bt_xml: $(find-pkg-share kachaka_sim_bringup)/behavior_trees/navigate_to_pose_no_backup.xml
    default_nav_through_poses_bt_xml: $(find-pkg-share kachaka_sim_bringup)/behavior_trees/navigate_through_poses_no_backup.xml

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.8
      vx_min: 0.0
      vy_max: 0.5
      wz_max: 1.57
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        # Not before the goal checker's xy_goal_tolerance: turning to the goal
        # heading earlier can leave the robot facing away from a goal behind
        # it, which it cannot reverse to (vx_min 0), until a recovery spin.
        threshold_to_consider: 0.25
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        # Hand over to the goal critics where GoalAngleCritic takes over: with
        # both at 0.5 nothing but GoalCritic steers 0.25-0.5 m from the goal.
        threshold_to_consider: 0.25
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.25  # as PathAlignCritic
        max_angle_to_furthest: 1.0
        mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.25, 0.13], [0.25, -0.13], [-0.16, -0.13], [-0.16, 0.13]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan parked_shelves other_robots
        scan:
          topic: /kachaka/lidar/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        parked_shelves:
          # command_server's outlines of the shelves standing in the room (the
          # LiDAR sees only their legs). Range is from the map origin.
          topic: /parked_shelves
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 50.0
        other_robots:
          # fleet_outlines' footprints of the other robots (fleet.launch.py
          # only; the LiDAR sees only their laser housings). The LiDAR clears
          # where they were. Range is from the map origin.
          topic: /other_robots
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 50.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.25, 0.13], [0.25, -0.13], [-0.16, -0.13], [-0.16, 0.13]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan parked_shelves other_robots
        scan:
          topic: /kachaka/lidar/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        parked_shelves:
          # command_server's outlines of the shelves standing in the room (the
          # LiDAR sees only their legs). Range is from the map origin.
          topic: /parked_shelves
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 50.0
        other_robots:
          # fleet_outlines' footprints of the other robots (fleet.launch.py
          # only; the LiDAR sees only their laser housings). The LiDAR clears
          # where they were. Range is from the map origin.
          topic: /other_robots
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 50.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # /map with the cells under the robot freed (footprint_map_filter), so
        # a docked shelf's legs still in the SLAM map do not enclose the robot.
        map_topic: /nav_map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 1.57]
    min_velocity: [0.0, 0.0, -1.57]
    max_accel: [2.0, 0.0, 3.0]
    max_decel: [-2.0, 0.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan", "other_robots"]
    scan:
      type: "scan"
      topic: "/kachaka/lidar/scan"
      min_height: 0.05
      max_height: 2.0
      enabled: True
    other_robots:
      # fleet_outlines (fleet.launch.py only). Timeout 0: without it running
      # the source is ignored instead of stopping the robot.
      type: "pointcloud"
      topic: "/other_robots"
      min_height: 0.05
      max_height: 2.0
      source_timeout: 0.0
      enabled: True

docking_server:
  # Used by kachaka_sim_bringup's command_server for RETURN_HOME. The real
  # robot backs onto its charger (it drives forward to leave it), so this is
  # the one place the robot reverses: the last ~0.9 m from the staging pose
  # straight onto the dock. Docking publishes /cmd_vel directly.
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: true
    dock_prestaging_tolerance: 0.1

    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      # The goal carries the dock pose (the charger location); near the dock
      # the simulator's detection (sim/charger_detection, relayed by
      # command_server) refines it. The detection is the docked robot pose,
      # so it is turned by pi to point into the dock. Within docking_threshold
      # Nav2 considers itself docked; the simulator decides whether the
      # contacts touch (battery_state).
      use_external_detection_pose: true
      external_detection_timeout: 1.0
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 3.14159
      filter_coef: 0.1
      docking_threshold: 0.02
      staging_x_offset: -0.9
      staging_yaw_offset: 3.14159  # face away from the dock, ready to back in
      use_battery_status: false
      use_stall_detection: false

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.1
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      # The charger the robot backs onto stays in the local costmap, and the
      # projected path ends inside it. The distance is to the controller's
      # target, 0.25 m beyond the dock pose: skip the checks for the last
      # ~0.35 m (0.3 here let a rare false collision fail every retry).
      dock_collision_threshold: 0.6

shelf_docking_server:
  # A second docking server for Kachaka Shelves (launch/shelf_docking.launch.py),
  # used by command_server for DOCK_SHELF, MOVE_SHELF and RETURN_SHELF. The
  # robot drives forward under a shelf, unlike onto the charger, and Jazzy sets
  # the direction per server. The dock pose is the pose of a robot docked
  # under the shelf; command_server relays the simulator's shelf detection
  # (or, to put a shelf down, the destination) to shelf_detected_dock_pose.
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.1

    dock_plugins: ['shelf_dock']
    shelf_dock:
      plugin: 'opennav_docking::SimpleNonChargingDock'
      use_external_detection_pose: true
      external_detection_timeout: 1.0
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      docking_threshold: 0.02
      staging_x_offset: -0.9
      staging_yaw_offset: 0.0
      use_stall_detection: false

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      # The robot passes the shelf's legs a few centimetres off; skip the
      # checks once its front is near the shelf. The distance is to the
      # controller's target, 0.25 m beyond the dock pose.
      dock_collision_threshold: 0.85

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
