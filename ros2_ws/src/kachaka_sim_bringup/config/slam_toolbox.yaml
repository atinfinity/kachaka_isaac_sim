# slam_toolbox (online async) for the Kachaka LiDAR.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    # Keep rays with no return as inf. Replacing them with a finite value to
    # map free space breaks scan matching: Karto's lookup table (Karto.h,
    # GridIndexLookup::ComputeOffsets) skips points by checking inf/nan in the
    # range array with the index of the filtered point array, so finite values
    # change which points are matched, and the pose stops following forward
    # motion in long corridors (2 m error after 3 m in the office scene).
    scan_topic: /kachaka/lidar/scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.1
    max_laser_range: 10.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    # Without this, scans taken while turning in place are dropped and the map
    # does not grow until the robot drives forward.
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    # Loop closures correct the pose by at most half of this (1.5 m). At 8 m
    # one matched a scan taken under a towed shelf to the wrong end of the
    # 5 x 4 m room and threw the map pose 3.7 m off (#39).
    loop_search_space_dimension: 3.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Trust odometry more than the default 0.5: past a doorway into a corridor
    # with no end wall in range, matching slid 0.2 m forward per pass.
    distance_variance_penalty: 0.1
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
