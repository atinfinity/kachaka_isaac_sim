# The built-in room with two shelves, two locations, a person and an extra
# box. Shelf 2, the person and the box are placed at random.
#   scripts/run_sim.sh --layout layouts/room.yaml [--layout-seed N]
world: room
seed: 7
clearance: 0.15
spawn: [0.0, 0.0, 0.0]
charger: [-2.27, 0.0, 0.0]        # back panel on the west wall
shelves:
  - {id: S01, name: Shelf 1, pose: [1.3, -1.2, 0.0]}
  # Somewhere in the north-east quarter, roughly facing east.
  - {id: S02, name: Shelf 2, pose: [[0.4, 2.0], [0.2, 1.6], [-0.5, 0.5]]}
locations:
  - {id: L01, name: Kitchen, pose: [0.5, 1.0, 1.5708]}
  - {id: L02, name: Entrance, pose: [-1.6, -1.4, 3.1416]}
people:                            # east half, facing anywhere
  - [[0.8, 2.1], [-0.4, 1.7], [-3.14, 3.14]]
boxes:
