# ROS 2 tools for the simulator (or a real Kachaka): SLAM, Nav2, RViz, teleop.
#
#   xhost +local:                       # let containers open RViz windows
#   docker compose -f docker/compose.yaml up slam
#   docker compose -f docker/compose.yaml run --rm teleop
#
# Host networking so DDS discovery reaches the simulator on the same machine.
x-ros: &ros
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: kachaka-isaac-sim-ros:jazzy
  network_mode: host
  ipc: host
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    # Larger socket buffers: camera images drop without them.
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4?sockets_size=4194304
    DISPLAY: ${DISPLAY:-:0}
    QT_X11_NO_MITSHM: "1"
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ../maps:/maps

services:
  slam:
    <<: *ros
    command: ros2 launch kachaka_sim_bringup slam.launch.py nav:=${NAV:-false} rviz:=${RVIZ:-true}

  navigation:
    <<: *ros
    command: ros2 launch kachaka_sim_bringup navigation.launch.py map:=/maps/${MAP:-map}.yaml rviz:=${RVIZ:-true}

  rviz:
    <<: *ros
    command: ros2 launch kachaka_sim_bringup rviz.launch.py

  teleop:
    <<: *ros
    stdin_open: true
    tty: true
    command: ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r cmd_vel:=/kachaka/manual_control/cmd_vel

  shell:
    <<: *ros
    stdin_open: true
    tty: true
    command: bash
